services:
  db:
    image: postgres:15-alpine
    container_name: cogninote_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogninote_network

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.4.9.11
    container_name: cogninote_lightrag
    ports:
      - "8020:8020"
    env_file: ".env.lightrag"
    volumes:
      - lightrag_rag_storage:/app/rag_storage
      - lightrag_inputs:/app/inputs
    networks:
      - cogninote_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build: .
    container_name: cogninote_app
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
      BETTER_AUTH_TRUSTED_ORIGIN: ${BETTER_AUTH_TRUSTED_ORIGIN}
      LIGHTRAG_API_URL: http://lightrag:8020
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
      lightrag:
        condition: service_healthy
    networks:
      - cogninote_network
    restart: unless-stopped

volumes:
  postgres_data:
  lightrag_rag_storage:
  lightrag_inputs:

networks:
  cogninote_network:
    driver: bridge
