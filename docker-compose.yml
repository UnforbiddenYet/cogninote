services:
  db:
    image: postgres:15-alpine
    container_name: cogninote_postgres
    environment:
      POSTGRES_USER: cogninote_user
      POSTGRES_PASSWORD: cogninote_password
      POSTGRES_DB: cogninote_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogninote_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogninote_network

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.4.9.11
    container_name: cogninote_lightrag
    ports:
      - "8020:8020"
    env_file: ".env.lightrag"
    volumes:
      - lightrag_rag_storage:/app/rag_storage
      - lightrag_inputs:/app/inputs
    networks:
      - cogninote_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  lightrag_rag_storage:
  lightrag_inputs:

networks:
  cogninote_network:
    driver: bridge
