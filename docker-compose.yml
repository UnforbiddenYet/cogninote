name: cogninote
services:
  db:
    image: postgres:15-alpine

    environment:
      POSTGRES_USER: "${POSTGRES_USER:-cogninote_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cogninote_password}"
      POSTGRES_DB: "${POSTGRES_DB:-cogninote_db}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cogninote_user} -d ${POSTGRES_DB:-cogninote_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cogninote_network
    restart: unless-stopped

  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.4.9.11

    ports:
      - "127.0.0.1:8020:8020"
    env_file: ".env.lightrag"
    environment:
      HOST: 0.0.0.0
      PORT: 8020
      WORKING_DIR: /app/rag_storage
      INPUT_DIR: /app/inputs
    volumes:
      - lightrag_rag_storage:/app/rag_storage
      - lightrag_inputs:/app/inputs
    networks:
      - cogninote_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_BETTER_AUTH_BASE_URL: http://localhost:3000

    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cogninote_user}:${POSTGRES_PASSWORD:-cogninote_password}@db:5432/${POSTGRES_DB:-cogninote_db}"
      LIGHTRAG_API_URL: http://lightrag:8020
      LIGHTRAG_TIMEOUT_MS: 10000
      LIGHTRAG_MAX_RETRIES: 2
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-change-me-in-production-at-least-32-chars-long}"
      BETTER_AUTH_BASE_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGIN: http://localhost:3000
      ALLOWED_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      lightrag:
        condition: service_healthy
    networks:
      - cogninote_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"await fetch('http://localhost:3000/health').then(r => {if(!r.ok) process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  lightrag_rag_storage:
  lightrag_inputs:

networks:
  cogninote_network:
    driver: bridge
