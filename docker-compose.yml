services:
  db:
    image: postgres:15-alpine
    container_name: mindgraph_postgres
    environment:
      POSTGRES_USER: mindgraph_user
      POSTGRES_PASSWORD: mindgraph_password
      POSTGRES_DB: mindgraph_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindgraph_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mindgraph_network

  lightrag:
    build:
      context: .
      dockerfile: docker/lightrag/Dockerfile
    container_name: mindgraph_lightrag
    ports:
      - "8020:8020"
    environment:
      RAG_DIR: /app/rag_storage
      INPUT_DIR: /app/inputs
      VERBOSE_DEBUG: ${VERBOSE_DEBUG}
      LLM_BINDING: ${LLM_BINDING}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST}
      LLM_MODEL: ${LLM_MODEL}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY}
      EMBEDDING_BINDING: ${EMBEDDING_BINDING}
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
    volumes:
      - lightrag_rag_storage:/app/rag_storage
      - lightrag_inputs:/app/inputs
    networks:
      - mindgraph_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8020/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
  lightrag_rag_storage:
  lightrag_inputs:

networks:
  mindgraph_network:
    driver: bridge
